[package]
name = "santa-harness"
version = "0.1.0"
edition = "2021"
description = "What a Rust SANTA runner needs besides its implementation: the grading interpreter (a copy of SANTA's santa-check), selection, the oracle self-checks, the bounded-file watchdog, results.json. Copied byte for byte into each Rust runner SANTA maintains; reads a SANTA checkout as data only."
publish = false

[dependencies]
serde_json = "1"
libc = "0.2"

[dev-dependencies]
jsonschema = { version = "0.46", default-features = false }
